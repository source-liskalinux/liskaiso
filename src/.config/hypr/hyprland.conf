# LISKA LINUX HYPRLAND CONFIGURATION

monitor=,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = pipewire

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 8
    gaps_out = 14
    border_size = 2    
    col.active_border = rgba(58a6ffee) rgba(39c5bbee) 45deg
    col.inactive_border = rgba(161b22aa)
    layout = dwindle
    no_cursor_warps = true
}

decoration {
    rounding = 14
    active_opacity = 0.88
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(00000044)
}

animations {
    enabled = true
    bezier = glassy, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, glassy
    animation = windowsOut, 1, 5, glassy, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, glassy, slide
}

$mainMod = SUPER

bind = $mainMod, Return, exec, alacritty
bind = $mainMod, B, exec, firefox
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, E, exit,
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, W, exec, ~/.config/hypr/scripts/set-wallpaper.sh
bind = $mainMod, S, exec, ~/.config/hypr/scripts/launch-installer.sh
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5